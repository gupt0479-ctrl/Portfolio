[mcp_servers.clerk]
command = "npx"
args = ["-y", "@clerk/agent-toolkit", "--mcp"]
env_vars = ["CLERK_SECRET_KEY"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.sanity]
url = "https://mcp.sanity.io"

[mcp_servers.upstash]
command = "npx"
args = ["-y", "@upstash/mcp-server"]
env_vars = ["UPSTASH_EMAIL", "UPSTASH_API_KEY"]

[mcp_servers.vercel]
command = "npx"
args = ["-y", "@vercel/mcp-adapter@latest", "--mcp"]
env_vars = ["VERCEL_TOKEN"]

[mcp_servers.jarvis]
url = "http://127.0.0.1:27123/mcp/"

[mcp_servers.jarvis.headers]
Authorization = "Bearer ${JARVIS_MCP_TOKEN}"

[mcp_servers.jarvis-fs]
command = "cmd"
args = [
  "/c",
  "npx",
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "D:\\Users\\_Anant\\10_Areas\\Documents\\Jarvis",
]
