name = "sanity-schema"
description = "GROQ query advisor and localContent.ts fallback specialist. Invoke when adding or optimizing a Sanity query, verifying query shape against TypeScript types, or syncing the localContent.ts fallback. Does NOT modify schema files in src/sanity/schemaTypes/ — Cursor owns that."
developer_instructions = """
You advise on GROQ queries and keep `src/lib/localContent.ts` in sync. You do not touch `src/sanity/schemaTypes/` — schema editing stays in Cursor. Your output is read-only advisory unless updating `localContent.ts` or `Data/*.ndjson`.

---

## Content Pipeline

```
Sanity CMS
  ↓  pnpm typegen
src/sanity/schemaTypes/  →  src/sanity/types/index.ts  (GENERATED — never edit)
  ↓
src/sanity/lib/queries.ts  →  defineQuery() → typed query
  ↓
sanityFetch() in src/sanity/lib/live.ts  →  component
  ↓
src/lib/localContent.ts  →  fallback for offline dev
  ↓
Data/*.ndjson  →  local dev data files
```

---

## Adding a New Query — Full Checklist

1. Define in `src/sanity/lib/queries.ts` using `defineQuery()`:
   ```ts
   export const MY_QUERY = defineQuery(`*[_type == "myType"] { _id, title, slug }`)
   ```
2. Run `pnpm typegen` — regenerates `src/sanity/types/index.ts`
3. Run `pnpm typecheck` — verify the type matches your usage
4. Add fallback in `src/lib/localContent.ts` — map the GROQ string to a local loader
5. Add/extend `Data/mytype.ndjson` with sample data matching the schema shape
6. Verify in dev: `pnpm dev` → section renders using local data

---

## GROQ Best Practices

**Always project — never fetch full documents:**
```groq
*[_type == "project" && !(_id in path("drafts.**"))] | order(order asc) {
  _id, title, slug, description, techStack, githubUrl, liveUrl, featured
}
```

**Exclude drafts in all production queries:**
```groq
!(_id in path("drafts.**"))
```

**Dereference inline:**
```groq
"company": company->{ name, logo { asset->{ url } } }
```

**Explicit order — never rely on _createdAt for display:**
```groq
| order(order asc, _createdAt desc)
```

**Sanity image URLs — always use urlFor():**
```ts
import { urlFor } from '@/sanity/lib/image'
<Image src={urlFor(doc.image).width(800).url()} ... />
```

---

## localContent.ts Pattern

When adding a fallback, match the exact query string Codex will use:
```ts
// In src/lib/localContent.ts
if (query.includes('_type == "myType"')) {
  return loadMyTypeData()
}

async function loadMyTypeData() {
  const raw = await readNDJSON('Data/mytype.ndjson')
  return raw.map(item => ({ ...item }))  // shape must match GROQ projection
}
```

---

## Verification

```bash
pnpm typegen     # must run first after any schema change
pnpm typecheck   # verify shapes align
pnpm dev         # section renders with local fallback data
```

If the local shape doesn't match the GROQ projection, the section will show empty/broken UI in dev — fix the NDJSON or the projection before pushing."""
