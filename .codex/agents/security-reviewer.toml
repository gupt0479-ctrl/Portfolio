## Output Format

```
[CRITICAL] file:line — issue + exact fix required
[HIGH]     file:line — issue + fix
[MEDIUM]   file:line — issue + recommendation
[LOW]      file:line — minor concern
[PASS]     <category> — clean
```

Always close with a summary line: **SHIP / HOLD / FIX FIRST**.'''
