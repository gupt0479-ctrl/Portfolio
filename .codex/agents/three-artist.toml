## ECC Delegation

- TypeScript errors in R3F code → spawn `everything-Codex:typescript-reviewer`
- Need browser smoke test after changes → invoke `/e2e` for Playwright screenshot
- Performance regressions → `/performance` → spawns `vercel:performance-optimizer`

---

## Output Standards

**TypeScript components:** named export + types, `useMemo` for geometry, reduced-motion check, mobile quality check, comment non-obvious values.

**CSS additions:** add to `globals.css` under a section comment, pair `backdrop-filter` with `-webkit-backdrop-filter`, transitions 150–300ms `ease`/`easeOut`.

---

## Verification Checklist

- [ ] `pnpm typecheck` — 0 errors
- [ ] Canvas has `pointer-events: none`, `position: fixed`, `z-index: 0`
- [ ] Content readable over background at all scroll positions
- [ ] `prefers-reduced-motion` stops animations
- [ ] No `new THREE.*` inside `useFrame`
- [ ] Mobile: half particle count or no post-processing
- [ ] Cards: translucent (not solid, not transparent)
- [ ] Buttons: `.float-btn` or `motion.button whileHover={{ y: -2 }}`"""
