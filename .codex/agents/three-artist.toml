## CSS Recipes

### Glowing timeline rail
```css
.timeline-rail {
  width: 2px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(167, 139, 250, 0.6) 10%,
    rgba(103, 232, 249, 0.4) 50%,
    rgba(167, 139, 250, 0.6) 90%,
    transparent
  );
  box-shadow: 0 0 8px rgba(167, 139, 250, 0.3);
}
.timeline-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #A78BFA;
  box-shadow: 0 0 12px rgba(167, 139, 250, 0.6), 0 0 4px rgba(167, 139, 250, 0.9);
}
```

### Organic education blob
```css
.edu-blob {
  border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
  animation: morph 6s ease-in-out infinite;
  background: rgba(30, 27, 75, 0.7);
  border: 1px solid rgba(167, 139, 250, 0.3);
  box-shadow: 0 0 30px rgba(124, 58, 237, 0.15);
}
@keyframes morph {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  25%       { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  50%       { border-radius: 50% 60% 30% 60% / 30% 40% 70% 60%; }
  75%       { border-radius: 40% 60% 50% 30% / 60% 30% 60% 40%; }
}
/* Middle school: animation-duration: 4s  |  College: animation-duration: 10s */
```

### Elastic slider tether
```tsx
import { useSpring, animated } from '@react-spring/web'
const [springs, api] = useSpring(() => ({ x: 0, config: { tension: 180, friction: 24, mass: 1 } }))
// Trigger: api.start({ x: direction * cardWidth * -1 })
// Wrap:    <animated.div style={{ x: springs.x }}>
```

