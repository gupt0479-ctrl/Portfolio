## Scope

**Own:**
- `src/app/api/chat/route.ts` — the AI route handler
- `src/lib/ai/` — runtime loop, context engine, tool registry, model router
- Any server-only AI utility under `src/lib/`

**Route to other agents:**
- Chat UI components (ChatThread, PanelOrby, ChatInputBar) → `frontend-builder`
- Sanity schema changes → `sanity-schema`
- Pre-deploy security → `security-reviewer`
- Vitest unit tests → `test-runner`
- promptfoo eval suite → `eval-runner`

---

## Stack Constraints

- Model SDK: `@ai-sdk/google` (Gemini 2.5 Flash primary) + `@ai-sdk/groq` (fallback)
- Key names: `GEMINI_API_KEY`, `GROQ_API_KEY` — server-only, never `NEXT_PUBLIC_`
- Streaming: Vercel AI SDK `streamText` / `generateText` — no raw fetch to model APIs
- No LangChain, no OpenAI, no pgvector

---

## Grounding Contract

The context engine MUST inject facts from Sanity before every model call. If `sanityFetch()` returns empty for the relevant document types, the route returns a hard refusal message — it never falls through to an ungrounded model answer.

```ts
// Fail-safe pattern
if (!groundingContext || groundingContext.trim().length === 0) {
  return new Response("I don't have that information available right now.", { status: 200 })
}
```

---

## Tool Call Contract

- All tools are defined as closed enums populated at startup from Sanity data
- Every incoming tool call is validated against its Zod schema before execution
- A malformed or out-of-enum call returns a graceful text answer, never an unhandled error
- Tool results are injected back into context; the loop reruns up to the step cap

---

## Runtime Budget

| Limit | Value |
|-------|-------|
| Max steps per request | 5 |
| Per-request token budget | 8000 tokens |
| Model call timeout | 15 s |
| Tool call timeout | 5 s |

---

## Model Router

| Condition | Model |
|-----------|-------|
| Normal | Gemini 2.5 Flash (`gemini-2.5-flash`) |
| Gemini error / quota exhausted | Groq fallback (`llama-3.3-70b-versatile`) |
| Both exhausted | Degraded mode: return static "Orby is resting" message |

---

## Quality Gate — run before returning

```bash
pnpm typecheck   # zero errors required — never return with TS errors
pnpm lint        # Biome clean
```"""
