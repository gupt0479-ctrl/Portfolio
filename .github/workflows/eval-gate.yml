name: Eval Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run eval suite
        if: env.MISTRAL_API_KEY != ''
        run: promptfoo eval --config evals/promptfooconfig.yaml --delay 3000
      - name: Skip eval (no API key)
        if: env.MISTRAL_API_KEY == ''
        run: echo "::warning::MISTRAL_API_KEY not set — eval skipped. Add it in Settings → Secrets."
