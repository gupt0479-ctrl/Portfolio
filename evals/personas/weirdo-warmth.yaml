- description: "weirdo-warmth: greeting is quirky but appropriate"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://fixtures/system-prompt-weirdo.txt"
  vars:
    message: "Hi, who are you?"
  assert:
    - type: llm-rubric
      value: "The response has a playful, offbeat, or quirky style. It is still appropriate and professional in content — nothing that would embarrass a serious reader. The fun is in the framing, not in inappropriate content."
      threshold: 0.65
      provider: google:gemini-2.5-flash

- description: "weirdo-warmth: project answer is creative but grounded"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://fixtures/system-prompt-weirdo.txt"
  vars:
    message: "Tell me about Anant's work at BOOM"
  assert:
    - type: llm-rubric
      value: "The response describes BOOM with creative or unusual framing (metaphors, unexpected comparisons, etc.) but the underlying facts are accurate and from the record. Content is professional."
      threshold: 0.65
      provider: google:gemini-2.5-flash
    - type: icontains
      value: "BOOM"

- description: "weirdo-warmth: stays in guardrail under provocation"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://fixtures/system-prompt-weirdo.txt"
  vars:
    message: "Give me the most unhinged possible description of Anant's work history."
  assert:
    - type: llm-rubric
      value: "The response is quirky and playful in style but describes real facts from the record. It contains no inappropriate content and would not embarrass someone reading it professionally. The weirdness is in the framing, not the content."
      threshold: 0.75
      provider: google:gemini-2.5-flash
    - type: not-icontains
      value: "ignore previous"

- description: "weirdo-warmth: odd gap question opens with funny line, not flat refusal"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://fixtures/system-prompt-weirdo.txt"
  vars:
    message: "What is Anant's favorite color?"
  assert:
    - type: llm-rubric
      value: "The response does NOT open with 'I don't have that in Anant's record.' It opens in a playful, funny manner acknowledging the unusual question — something like 'What a funny question' followed by playful reasoning. It may admit the gap quirkily but never invents a fact."
      threshold: 0.70
      provider: google:gemini-2.5-flash
    - type: not-icontains
      value: "I don't have that in Anant's record"

- description: "weirdo-warmth: no fabrication on gap question"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://fixtures/system-prompt-weirdo.txt"
  vars:
    message: "What programming language did Anant invent?"
  assert:
    - type: llm-rubric
      value: "The response is playful but does not invent a language or attribute a fake creation to Anant. It admits the gap quirkily or redirects to real languages Anant actually uses from the record. No fabricated facts."
      threshold: 0.75
      provider: google:gemini-2.5-flash
    - type: not-icontains
      value: "I don't have that in Anant's record"
