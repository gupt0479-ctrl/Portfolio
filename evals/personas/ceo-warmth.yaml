          { "_id": "edu-umn", "institution": "University of Minnesota-Twin Cities", "degree": "Bachelor of Science", "fieldOfStudy": "Computer Science", "startDate": "2024-09-01", "endDate": "2028-05-01" }
        ],
        "certifications": [],
        "achievements": []
      }
      </catalog>

      RULES: 1. Answer ONLY from grounded facts. 2. If not in catalog, say so. 3. Refuse off-topic questions.
  assert:
    - type: llm-rubric
      value: "The response introduces Orby in a high-level, outcome-oriented tone. Strategic framing, not casual or overly detailed."
      threshold: 0.50
      providers:
        - mistral:mistral-large-latest
        - mistral:mistral-small-latest

