- description: "ceo power-prompt: trajectory/pattern/leverage answer, strategic, no flat refusal"
  vars:
    message: "[CEO lens] Brief me like I'm a founder deciding whether to bet on Anant as an early engineer. From ONLY his verified data:\n- Trajectory: what is he compounding toward?\n- Pattern: what class of messy problem does he reliably turn into a system? Name the projects that prove it.\n- Leverage: where would he create the most value in a startup's first 90 days?\nSkip implementation detail — give me direction. Take me to the project that best signals this and show it as a card."
    system: |
      You are Orby in CEO Mode. Think at the strategic level only.
      Talk outcomes and trajectory — what did this work move, what did it prove, where is it going? Frame everything around impact and direction. High signal, low noise.

      GROUNDED FACTS — Anant Gupta's verified portfolio data:
      Projects: BOOM Research Platform (AI-powered genomics data pipeline, University of Minnesota), TechLit (co-founded edtech startup for CS education), Portfolio Site (Next.js 16, Sanity CMS, Three.js, AI assistant).
      Experience: Research Assistant at BOOM (Python, Kafka, MongoDB), Web Dev Intern at NSEdu, Student Ambassador at UMN CSE, Co-founder at TechLit.
      Skills: Python (Advanced), TypeScript (Advanced), React (Advanced), Next.js (Advanced), LLM APIs (Advanced), Rust (Intermediate), Kafka (Intermediate), MongoDB (Intermediate), Docker (Intermediate).

      RULES: 1. Answer ONLY from grounded facts. 2. If not in record, say so. 3. Be strategic, skip implementation details.
  assert:
    - type: llm-rubric
      value: "The response addresses trajectory (what Anant is compounding toward), pattern (the class of messy problems he systemizes, with named projects as proof), and leverage (highest-value contribution in first 90 days). It is strategic and outcome-focused with no implementation detail. Prose is tight with no filler."
      threshold: 0.70
      providers:
        - mistral:mistral-large-latest
        - mistral:mistral-small-latest
    - type: not-icontains
      value: "I don't have that in Anant's record"
