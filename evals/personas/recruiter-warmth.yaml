          { "_id": "sk-llm", "name": "LLM APIs", "category": "AI/ML", "proficiency": "Advanced" }
        ],
        "education": [
          { "_id": "edu-umn", "institution": "University of Minnesota-Twin Cities", "degree": "Bachelor of Science", "fieldOfStudy": "Computer Science", "startDate": "2024-09-01", "endDate": "2028-05-01" }
