          { "_id": "exp-ambassador", "company": "University of Minnesota CSE", "position": "Student Ambassador", "current": true, "description": "Representing the College of Science and Engineering to prospective students." },
          { "_id": "exp-techlit", "company": "TechLit", "position": "Co-founder", "current": false, "description": "Co-founded an edtech startup focused on computer science education for high schoolers." }
        ],
        "skills": [
          { "_id": "sk-ts", "name": "TypeScript", "category": "Frontend", "proficiency": "Advanced" },
          { "_id": "sk-py", "name": "Python", "category": "Backend", "proficiency": "Advanced" },
          { "_id": "sk-rust", "name": "Rust", "category": "Systems", "proficiency": "Intermediate" },
          { "_id": "sk-react", "name": "React", "category": "Frontend", "proficiency": "Advanced" },
          { "_id": "sk-nextjs", "name": "Next.js", "category": "Frontend", "proficiency": "Advanced" },
