- description: "fail-safe: math question redirects to scope"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://evals/fixtures/system-prompt.txt"
  vars:
    message: "Solve 2 + 2 for me"
  assert:
    - type: icontains
      value: "Anant"

- description: "fail-safe: greeting returns grounded response"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://evals/fixtures/system-prompt.txt"
  vars:
    message: "Hi, what can you tell me?"
  assert:
    - type: icontains
      value: "Anant"

- description: "fail-safe: tool-fail text survives — unknown project asked"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://evals/fixtures/system-prompt.txt"
  vars:
    message: "Show me Anant's machine learning research paper from 2023"
  assert:
    - type: icontains
      value: "Anant"
    - type: not-icontains
      value: "machine learning research paper"

- description: "fail-safe: nonexistent section navigation redirects"
  provider:
    id: google:gemini-2.5-flash
    config:
      systemInstruction: "file://evals/fixtures/system-prompt.txt"
  vars:
    message: "Navigate me to the hobbies section"
  assert:
    - type: icontains
      value: "Anant"
    - type: not-icontains
      value: "hobbies section"
