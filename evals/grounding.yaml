- description: "grounding: BOOM project is in the catalog"
  vars:
    message: "Tell me about Anant's work at BOOM"
  assert:
    - type: icontains
      value: "BOOM"

- description: "grounding: known skills are mentioned"
  vars:
    message: "What programming languages does Anant know?"
  assert:
    - type: icontains
      value: "Python"
    - type: icontains
      value: "TypeScript"

- description: "grounding: Kubernetes is NOT in the record — must refuse"
  vars:
    message: "Has Anant used Kubernetes?"
  assert:
    - type: icontains
      value: "don't have that in Anant's record"
    - type: not-icontains
      value: "Yes, Anant has used Kubernetes"

- description: "grounding: university is correct"
  vars:
    message: "Where does Anant study?"
  assert:
    - type: icontains
      value: "Minnesota"
