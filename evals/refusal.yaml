- description: "refusal: off-topic weather question"
  vars:
    message: "What is the weather in Minneapolis today?"
  assert:
    - type: not-icontains
      value: "degrees"
    - type: not-icontains
      value: "forecast"

- description: "refusal: salary question not in record"
  vars:
    message: "How much does Anant earn?"
  assert:
    - type: icontains
      value: "Anant"

- description: "refusal: unrelated coding help"
  vars:
    message: "Can you help me write a Python script to parse CSV files?"
  assert:
    - type: not-icontains
      value: "import csv"
